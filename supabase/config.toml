# ═══════════════════════════════════════════════════════════════════════════
#  شركة الهدف للتوظيف (HRC) — إعداد Supabase CLI
#  ---------------------------------------------------------------------------
#  هذا الملف يجعل المستودع متوافقاً مع تكاملة GitHub في Supabase:
#    • supabase/migrations/  ← مخطط قاعدة البيانات (يُطبَّق تلقائياً على main)
#    • supabase/config.toml  ← هذا الملف
#
#  ملاحظات مهمة:
#    • المستودع **عام**، فلا تضع هنا أي سرّ أو مفتاح.
#    • إعدادات API وAuth في هذا الملف **تُتجاهل** من تكاملة GitHub افتراضياً
#      (المصدر الرسمي: docs.guides/deployment/branching/github-integration).
#      الذي يُطبَّق: ملفات الـ migrations، ودوال Edge المُعلَنة في هذا الملف،
#      وحاويات التخزين — ولأننا لا نستخدم حاويات تخزين، فالمطبَّق هو المخطط
#      ودالة واحدة: hrc-staff-admin (انظر آخر الملف).
#    • مشروع سوبابيس في منطقة فرانكفورت (eu-central-1).
# ═══════════════════════════════════════════════════════════════════════════

# معرّف المشروع (نفس القيمة الظاهرة في رابط المشروع — ليس سرّاً)
project_id = "vqsvztudvfukyuerzcgx"

# ───────────────────────────────────────────────────────────────────────────
#  دالة إدارة حسابات الموظفين (Edge Function)
#  ---------------------------------------------------------------------------
#  ⚠️ استعملها المنظومة الداخلية لإنشاء الموظفين بلا أي مفتاح في المتصفح:
#     من «الإعدادات» → «إضافة موظف» → الدالة تُنشئ مستخدم Auth وتُربط سطر
#     brc.staff، والمفتاح السري يبقى في بيئة الدالة على خوادم Supabase.
#
#  🔴 هذا القسم هو ما يجعل النشر **تلقائياً**: تكاملة GitHub في Supabase
#     تقرأ الملف وتنشر الدوال المُعلَنة هنا مع كل دفعة إلى main. بلا هذا
#     القسم تبقى الدالة محلياً في المستودع ولا تصل المشروع — فيظهر للمدير
#     «الدالة السحابية غير منشورة» عند إنشاء أي حساب.
#
#  verify_jwt = true : بوّابة Supabase تتحقق من توكن الجلسة قبل الدالة،
#  والدالة تتحقق ثانياً من كون صاحبه مديراً نشطاً في brc.staff.
# ───────────────────────────────────────────────────────────────────────────
[functions.hrc-staff-admin]
enabled = true
verify_jwt = true

# ───────────────────────────────────────────────────────────────────────────
#  لا تُفعّل «Branching» (فروع معاينة لكل طلب دمج):
#   • متاح في خطة Pro فقط
#   • يُحاسب **بالساعة** وخارج سقف الصرف (Spend Cap)
#  أما «Deploy to production» فمجاني في كل الخطط ويكفي تماماً هنا.
# ───────────────────────────────────────────────────────────────────────────

# حاويات Storage: لا نستخدمها (الصور ثابتة داخل المستودع)

# deploy-trigger: 2026-10-14 — publish hrc-staff-admin via GitHub integration

# Public OTP bootstrap; all privileged RPCs remain service-only.
[functions.hrc-employer-otp]
enabled = true
verify_jwt = false
