# ═══════════════════════════════════════════════════════════════════════════
#  شركة بابل للتوظيف (BRC) — إعداد النشر على Render
#  ---------------------------------------------------------------------------
#  الموقع ثابت بالكامل (HTML/CSS/JS) ولا يحتاج خادماً ولا قاعدة بيانات،
#  لذا النشر لا يشغّل أي بناء: Render يقدّم الملفات المحفوظة كما هي (أسرع وأبسط
#  وأكثر أماناً — لا يحتاج ImageMagick أو أي أداة خارجية).
#
#  طريقة الاستخدام:
#   1) GitHub → ادمج الفرع في main
#   2) Render → New + → Blueprint → اختر هذا المستودع (سيكتشف render.yaml تلقائياً)
#      أو: New + → Static Site → اختر المستودع واترك الإعدادات فارغة
#   3) Publish Directory:  .        (جذر المستودع)
#      Build Command:      (اتركه فارغاً)
#
#  ملاحظة: رابط التحقق المطبوع في كيو آر كود الاستمارات يتبع نطاق النشر تلقائياً
#  (autoVerifyBase في assets/js/config.js)، لذا سيعمل المسح على نطاق Render
#  مباشرة، وعند ربط النطاق الرسمي brc-babil.com سيتحوّل إليه تلقائياً.
# ═══════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: babylonian-recruitment-company
    runtime: static
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    # ترويسات أمنية وتخزين مؤقت
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=604800

    # روابط نظيفة: /verify و /dashboard مثل الرابط المطبوع في الكيو آر كود
    routes:
      - type: rewrite
        source: /verify
        destination: /verify.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /standalone
        destination: /brc-standalone.html
      - type: rewrite
        source: /light
        destination: /brc-light.html
