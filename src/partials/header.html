      <!-- بوابة الموظفين: لا زر ظاهر (طلب الإدارة 2026-09-19).

           assets/js/nav.js (longPress). الوصول المباشر عبر /dashboard يبقى

           ⛔ لا زر «هامبرغر» هنا (2026-11-07 بطلب المالك): كان الزر يظهر على

           في public.js التي تُحمَّل في index.html وحدها، والترويسة هناك تُخفى
           أصلاً على الجوال (app-shell.css) ويستعمل الزائر شريط التبويب السفلي.
           فالزر نقرة ميتة لا تُظهر شيئاً؛ حُذف مع غلافه header-actions. زر
           «هامبرغر» الآخر (#hamburger-btn) يخص اللوحة بعد الدخول ويعمل كما هو. -->
