<header class="site-header">

    <div class="header-main">
      <!-- اسم الشركة = بوابة الموظفين المخفية: نقرة عادية → أعلى الصفحة،
           وضغطة مطوّلة (1.2 ثانية) → شاشة تسجيل الدخول. المنطق في nav.js. -->
      <a class="brand" id="brand-home" href="index.html#home" data-staff-gate>

        <span class="brand-text">
          <b>شركة الهدف للتوظيف</b>
          <span>Al-Hadaf Recruitment Co.</span>
        </span>
      </a>

      <div class="header-contact">
        <a class="hc-item hc-address" href="https://www.google.com/maps?q=32.4823913,44.4105048" target="_blank" rel="noopener" title="فتح الموقع في خرائط جوجل">
          <svg class="ic"><use href="#i-pin" xlink:href="#i-pin"/></svg>
          <span>حلة - شارع 60 - قرب مدينة حمورابي - قرب مجمع الكرعاوي</span>
        </a>
        <span class="hc-item hc-phones-item">
          <svg class="ic"><use href="#i-whatsapp" xlink:href="#i-whatsapp"/></svg>
          <span class="hc-phones">
            <a href="https://wa.me/9647760058007" target="_blank" rel="noopener" dir="ltr" class="mono">07760058007</a>
            <a href="https://wa.me/9647715993271" target="_blank" rel="noopener" dir="ltr" class="mono">07715993271</a>
          </span>
        </span>
        <a class="hc-item hc-email" href="https://mail.google.com/mail/?view=cm&fs=1&to=contact@brc-babil.com" target="_blank" rel="noopener" title="إرسال بريد عبر جيميل">
          <svg class="ic"><use href="#i-mail" xlink:href="#i-mail"/></svg>
          <span dir="ltr" class="mono">contact@brc-babil.com</span>
        </a>
        <span class="hc-item hc-hours">
          <svg class="ic"><use href="#i-clock" xlink:href="#i-clock"/></svg>
          <span>السبت – الخميس: 9:00ص – 5:00م · الجمعة: عطلة رسمية</span>

      <div class="header-actions">
        <!-- بوابة الموظفين: لا زر ظاهر (طلب الإدارة 2026-09-19).

             assets/js/nav.js (longPress). السبب: الموقع واجهة للباحثين عن عمل،
             ووجود زر دخول ظاهر يعرّف كل زائر بعنوان المنظومة الداخلية.
             الوصول المباشر عبر /dashboard يبقى متاحاً لمن يعرفه من الموظفين. -->
        <button class="nav-toggle" id="nav-toggle" aria-label="إظهار القائمة" aria-expanded="false">
          <svg class="ic" style="width:20px;height:20px"><use href="#i-menu" xlink:href="#i-menu"/></svg>
        </button>

    <nav class="main-nav" id="main-nav" aria-label="التنقل الرئيسي">
